[project]
name = "ad-doctor"
version = "0.1.0"
description = "Read-only Active Directory misconfiguration audit: AD CS ESC, ACLs, Kerberos, delegation, GPO; SARIF and HTML reports"
readme = "README.md"
license = "MIT"
authors = [{ name = "Burak Özer" }]
requires-python = ">=3.12"
keywords = ["active-directory", "ldap", "security", "audit", "adcs", "kerberos", "sarif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration :: Authentication/Directory :: LDAP",
    "Typing :: Typed",
]
# pycryptodome: ldap3 falls back to it for NTLM's MD4, which OpenSSL 3 no longer provides
# pyspnego: NTLM with channel binding for LDAPS (ldap3 2.9 cannot send it)
dependencies = ["ldap3>=2.9.1", "pycryptodome>=3.21", "smbprotocol>=1.15", "pyspnego>=0.11"]

[project.optional-dependencies]
kerberos = ["gssapi>=1.8", "krb5>=0.5"]

[project.urls]
Homepage = "https://github.com/brkozer/ad-doctor"
Issues = "https://github.com/brkozer/ad-doctor/issues"

[project.scripts]
ad-doctor = "ad_doctor.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13", "rich>=13.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
packages = ["ad_doctor"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["ldap3", "ldap3.*", "smbclient", "smbclient.*", "smbprotocol", "smbprotocol.*", "spnego", "spnego.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lab: needs a live domain controller (AD_DOCTOR_LAB_* env vars)"]
addopts = "-m 'not lab'"
filterwarnings = ["ignore::DeprecationWarning:ldap3.*"]

[tool.ruff.lint.per-file-ignores]
# test data uses real-world (Turkish) names
"tests/*" = ["RUF001"]
