[project]
site_name = "ad-doctor"
site_description = "Read-only Active Directory security audit that fits in a pipeline"
site_url = "https://brkozer.github.io/ad-doctor/"
repo_url = "https://github.com/brkozer/ad-doctor"
repo_name = "brkozer/ad-doctor"
edit_uri = "edit/main/docs/"
copyright = "MIT licensed"
extra_css = ["assets/catalog.css"]
extra_javascript = ["assets/catalog.js"]
nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Quick start" = "quickstart.md" },
    { "Command line" = "cli.md" },
    { "Permissions needed" = "permissions.md" },
    { "Network probes" = "probes.md" },
  ] },
  { "Using ad-doctor" = [
    { "HTML viewer" = "viewer.md" },
    { "CI integration" = "ci.md" },
    { "Snapshots and redaction" = "snapshots.md" },
    { "Forest scan" = "forest.md" },
    { "Invariants (policy as code)" = "invariants.md" },
    { "What-if and plan" = "whatif.md" },
    { "Declared tier 0" = "declared-tier0.md" },
    { "BloodHound export" = "bloodhound.md" },
  ] },
  { "Checks" = "checks/index.md" },
  { "Reference" = [
    { "How it works" = "how-it-works.md" },
    { "Limits" = "limits.md" },
  ] },
  { "Changelog" = "changelog.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.action.edit",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "navigation.indexes",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
