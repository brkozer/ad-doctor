# Microsoft's fixed build for the CVEs ad-doctor compares hosts against.
#
# Every number comes from the MSRC CVRF document of the CVE's month
# (https://api.msrc.microsoft.com/cvrf/v3.0/cvrf/<YYYY-Mon>), field FixedBuild. A number is the
# lowest fixed build Microsoft lists for that Windows Server release, hotpatch included, so a
# hotpatched host is not reported by mistake. Only Windows Server on NT 10.0 is here: for 2012 and
# 2012 R2 the published number is a rollup's file version, not one UBR is known to match.
#
# Monthly upkeep: add new CVEs from MSRC, then change `updated`. ad-doctor adds a note when this
# date is older than `stale_after_days` at the time of the scan.

updated = "2026-11-09"
stale_after_days = 45

