id = "AD-ADCS-001"
aliases = ["esc1"]
summary = "A published certificate template lets broad groups supply the subject of an authentication certificate, so any user can enroll as a domain admin."
severities = ["high"]
severity_logic = "Always **high**: a single certificate request is enough to authenticate as any account."
mitre = ["T1649"]
data_sources = ["ldap"]
attributes = [
    "msPKI-Certificate-Name-Flag",
    "msPKI-Enrollment-Flag",
    "msPKI-RA-Signature",
    "pKIExtendedKeyUsage",
    "msPKI-Certificate-Application-Policy",
    "nTSecurityDescriptor (template DACL)",
    "certificateTemplates (on pKIEnrollmentService)",
]
related = ["AD-ADCS-002", "AD-ADCS-004", "AD-ADCS-008", "AD-PATH-001"]
since = "0.1.0"

risk = """
When a template has **Supply in the request** turned on, the requester writes the
subject and subject alternative name (SAN) of the certificate. If the template is also
valid for client authentication, the CA issues a certificate that Kerberos (PKINIT) and
Schannel accept as proof of identity for whoever is named in the SAN. A member of Domain
Users can therefore request a certificate for `administrator@corp.example` and log on as
that account.

The certificate stays valid until it expires or is revoked, even after the template is
fixed and the victim's password is changed, which makes ESC1 a persistence technique as
well. Strong certificate mapping (KB5014754) does not stop it: the requester can also
place the target's SID in the request.
"""

detection = """
ad-doctor reads every certificate template and the enterprise CAs (`pKIEnrollmentService`
objects) over LDAP and reports a template when **all** of these hold:

| Condition | Attribute |
|---|---|
| Published on at least one enterprise CA | `certificateTemplates` of a CA object |
| No manager approval | `msPKI-Enrollment-Flag` without `CT_FLAG_PEND_ALL_REQUESTS` (0x2) |
| No authorized signatures | `msPKI-RA-Signature` is 0 |
| A broad group can enroll | Enroll or AutoEnroll extended right in the template DACL for Everyone, Anonymous Logon, Authenticated Users, BUILTIN\\Users, Pre-Windows 2000 Compatible Access, Domain Users, Domain Guests or Domain Computers |
| Enrollee supplies the subject | `msPKI-Certificate-Name-Flag` has `CT_FLAG_ENROLLEE_SUPPLIES_SUBJECT` (0x1) |
| Usable for authentication | EKU (`pKIExtendedKeyUsage` / application policies) includes Client Authentication, Smart Card Logon, PKINIT Client Authentication or Any Purpose, or is empty |

Each reported object names the template and the broad groups that can enroll, for
example `LabESC1 (enroll: Domain Users)`.
"""

false_positives = """
- **Templates enrollable only by a narrower group** (for example a "Web Admins" group) are
  not reported by this check, even though members of that group can still abuse them.
  Review such templates by hand or with a dedicated AD CS tool.
- **CA-side controls** that LDAP cannot see, such as a policy module that rewrites the
  subject or a CA that has the template's requests set to pending in its own
  configuration, are not taken into account.
"""

remediation = """
Apply **at least one** of these, in order of preference:

1. **Build the subject from Active Directory.** In `certtmpl.msc`, open the template,
   *Subject Name* tab, select *Build from this Active Directory information*. Templates
   that really need a requester-supplied subject (web server certificates, for example)
   should not carry an authentication EKU.

2. **Restrict enrollment** to the group that needs the template. In the template's
   *Security* tab, remove *Enroll* and *Autoenroll* from Domain Users, Domain Computers,
   Authenticated Users and Everyone.

3. **Require CA manager approval** (sets `CT_FLAG_PEND_ALL_REQUESTS`):

    ```powershell
    $cfg = (Get-ADRootDSE).configurationNamingContext
    $dn  = "CN=LabESC1,CN=Certificate Templates,CN=Public Key Services,CN=Services,$cfg"
    $t   = Get-ADObject $dn -Properties 'msPKI-Enrollment-Flag'
    Set-ADObject $dn -Replace @{'msPKI-Enrollment-Flag' = ($t.'msPKI-Enrollment-Flag' -bor 2)} -WhatIf
    ```

4. **Stop publishing** a template nobody needs (run on the CA):

    ```powershell
    Remove-CATemplate -Name LabESC1 -WhatIf
    ```

Then **look for abuse**: in the CA console, *Issued Certificates*, compare the requester
with the subject for certificates from this template, and revoke any that were issued to
someone other than the requester (`certutil -revoke <serial> 1`).
"""

verify = "ad-doctor scan dc01.corp.example --ldaps -u 'CORP\\auditor' --only AD-ADCS-001"

