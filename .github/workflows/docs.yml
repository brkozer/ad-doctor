name: docs

# Deploys the documentation site to GitHub Pages. Gated on the repository variable
# DOCS_PUBLISH so it does nothing while the repo is private (Pages needs a paid plan on a
# private repo). One-time setup when the repo goes public:
#   Settings > Pages > Source: GitHub Actions
#   gh variable set DOCS_PUBLISH --body true
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DOCS_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --group docs
      - run: uv run python scripts/gen_docs.py
      - run: uv run zensical build --strict --clean
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
