name: release

# On a published GitHub release: attach the wheel and sdist. PyPI publishing with trusted
# publishing stays off until the repository variable PYPI_PUBLISH is set to "true".

on:
  release:
    types: [published]

jobs:
  assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: The tag must match the package version
        run: test "${GITHUB_REF_NAME#v}" = "$(uv version --short)"
      - run: uv build
      - run: gh release upload "$GITHUB_REF_NAME" dist/*
        env:
          GH_TOKEN: ${{ github.token }}

  pypi:
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
